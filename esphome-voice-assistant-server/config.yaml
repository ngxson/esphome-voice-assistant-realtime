name: "ESPHome Voice Assistant Realtime Server"
description: "Bridges ESPHome voice assistant devices to OpenAI Realtime API with optional Home Assistant tool integration."
version: "1.0.25"
slug: "esphome_voice_assistant_server"
url: "https://github.com/ngxson/esphome-voice-assistant-realtime"
init: false
homeassistant_api: false
hassio_api: false
auth_api: false
ingress: false
panel_icon: "mdi:microphone"

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

ports:
  8080/tcp: 8080

ports_description:
  8080/tcp: "WebSocket server for ESP32 voice assistant devices"

map:
  - data:rw

options:
  openai_api_key: ""
  websocket_port: 8080
  model: "gpt-realtime-mini"
  voice: "sage"
  vad_threshold: 0.5
  vad_prefix_padding_ms: 300
  vad_silence_duration_ms: 500
  instructions: "You are a helpful home assistant voice assistant. Be concise in your responses."
  session_reuse_timeout_seconds: 300
  enable_ha_tools: false
  ha_mcp_url: ""
  longlived_token: ""
  enable_recording: false
  idle_timeout_seconds: 3
  output_gain: 1.0

schema:
  openai_api_key: str
  websocket_port: int
  model: str
  voice: str
  vad_threshold: float
  vad_prefix_padding_ms: int
  vad_silence_duration_ms: int
  instructions: str
  session_reuse_timeout_seconds: int
  enable_ha_tools: bool
  ha_mcp_url: str
  longlived_token: str
  enable_recording: bool
  idle_timeout_seconds: int
  output_gain: float
